name: CI

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install '.[develop]'

      - name: Unit tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=json

      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib

          data = json.loads(pathlib.Path("coverage.json").read_text())
          print(f"## Coverage: {data['totals']['percent_covered_display']}%\n")
          print("| File | Stmts | Miss | Cover |")
          print("| --- | ---: | ---: | ---: |")
          for name, f in sorted(data["files"].items()):
              s = f["summary"]
              print(
                  f"| {name} | {s['num_statements']} | {s['missing_lines']} "
                  f"| {s['percent_covered_display']}% |"
              )
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: ignore

      - name: Install MMseqs2
        env:
          MMSEQS_VERSION: 18-8cc5c
          MMSEQS_SHA256: bd9b0234da5949ad528d5b5f9ea4cda9c1e23dce14b46c0791d4d919a76e61ce
        run: |
          wget -q "https://github.com/soedinglab/MMseqs2/releases/download/${MMSEQS_VERSION}/mmseqs-linux-avx2.tar.gz"
          echo "${MMSEQS_SHA256}  mmseqs-linux-avx2.tar.gz" | sha256sum -c -
          tar xzf mmseqs-linux-avx2.tar.gz
          echo "$PWD/mmseqs/bin" >> "$GITHUB_PATH"

      - name: evaluate-classes (FASTA, one file per class)
        run: |
          gb-qc evaluate-classes \
            --input example_datasets/G4_positives.fasta \
            --input example_datasets/G4_negatives.fasta \
            --out-folder ci_out/G4
          test -f "ci_out/G4/class/sequence/g4_negatives_vs_g4_positives/report.csv"
          test -f "ci_out/G4/class/sequence/g4_negatives_vs_g4_positives/report.html"

      - name: evaluate-classes (multiple CSV files, label column)
        run: |
          gb-qc evaluate-classes \
            --input example_datasets/enhancers_train.csv \
            --input example_datasets/enhancers_test.csv \
            --out-folder ci_out/enhancers
          test -f "ci_out/enhancers/class/sequence/0_vs_1/report.csv"
          test -f "ci_out/enhancers/class/sequence/0_vs_1/report.html"

      - name: evaluate-classes (TSV, multiple sequence columns)
        run: |
          gb-qc evaluate-classes \
            --input example_datasets/miRNA_mRNA_pairs_dataset.tsv \
            --sequence-column gene \
            --sequence-column noncodingRNA \
            --label-column label \
            --out-folder ci_out/miRNA
          test -f "ci_out/miRNA/class/gene/0_vs_1/report.csv"
          test -f "ci_out/miRNA/class/noncodingrna/0_vs_1/report.csv"
          test -f "ci_out/miRNA/class/merged/0_vs_1/report.csv"

      - name: evaluate-splits (data leakage, uses MMseqs2)
        run: |
          gb-qc evaluate-splits \
            --train-input example_datasets/enhancers_train.csv \
            --test-input example_datasets/enhancers_test.csv \
            --sequence-column sequence \
            --out-folder ci_out/splits
          test -f "ci_out/splits/split/sequence/enhancers_train_vs_enhancers_test/report.csv"
          test -f "ci_out/splits/split/sequence/enhancers_train_vs_enhancers_test/report.html"
