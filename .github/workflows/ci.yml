name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  # What the publish job at the bottom hangs off. A published Release rather
  # than a tag push, because a tag is easy to push by reflex and a Release is
  # not: it has a body you have to write and a button you have to mean.
  release:
    types: [published]

concurrency:
  # `github.ref` is `refs/tags/vX.Y.Z` for a release event and a branch ref
  # otherwise, so these two never share a group - a push to main cannot cancel
  # a release mid-upload.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # One version is enough: Ruff is a standalone binary that never imports the
      # code, so the interpreter cannot change its findings. The Python syntax it
      # assumes comes from `target-version` in pyproject.toml, which tracks the
      # project's minimum rather than this version.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install '.[develop]'

      # Rules and per-file exemptions live in [tool.ruff] in pyproject.toml, so
      # this runs exactly what `ruff check .` runs locally.
      - name: Ruff
        run: ruff check --output-format=github .

      # The report's scripts are real .js files rather than Python strings partly
      # so this can run, and `report/assets/__init__.py` says it runs in CI - so
      # it has to. Ruff never sees them, and nothing else parses them: a stray
      # bracket would otherwise ship in the wheel and only fail in the reader's
      # browser, silently, after the report was written.
      #
      # `--check` parses without executing, which is what is wanted here - these
      # scripts run in a browser and would not survive being run by node. It is
      # a step rather than a test so it cannot skip itself when node is missing;
      # ubuntu-latest ships one.
      # `|| exit 1` rather than leaning on the shell's -e: a failure inside a
      # loop body is exactly the case where `set -e` is easy to get wrong, and a
      # check that reports a syntax error and then exits 0 is worse than no
      # check. Same form as the command in CONTRIBUTING.md, so both fail alike.
      - name: JavaScript syntax
        run: |
          for file in src/genomic_benchmarks_qc/report/assets/*.js; do
            echo "node --check $file"
            node --check "$file" || exit 1
          done

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install '.[develop]'

      - name: Unit tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=json

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage.json ]; then
            echo "_No coverage data produced; skipping coverage summary._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib

          data = json.loads(pathlib.Path("coverage.json").read_text())
          print(f"## Coverage: {data['totals']['percent_covered_display']}%\n")
          print("| File | Stmts | Miss | Cover |")
          print("| --- | ---: | ---: | ---: |")
          for name, f in sorted(data["files"].items()):
              s = f["summary"]
              print(
                  f"| {name} | {s['num_statements']} | {s['missing_lines']} "
                  f"| {s['percent_covered_display']}% |"
              )
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: ignore

      - name: Install MMseqs2
        env:
          MMSEQS_VERSION: 18-8cc5c
          MMSEQS_SHA256: bd9b0234da5949ad528d5b5f9ea4cda9c1e23dce14b46c0791d4d919a76e61ce
        run: |
          wget -q "https://github.com/soedinglab/MMseqs2/releases/download/${MMSEQS_VERSION}/mmseqs-linux-avx2.tar.gz"
          echo "${MMSEQS_SHA256}  mmseqs-linux-avx2.tar.gz" | sha256sum -c -
          tar xzf mmseqs-linux-avx2.tar.gz
          echo "$PWD/mmseqs/bin" >> "$GITHUB_PATH"

      - name: evaluate-classes (FASTA, one file per class)
        run: |
          gb-qc evaluate-classes \
            --input examples/fasta-classes/data/coding_seqs.fasta \
            --input examples/fasta-classes/data/intergenomic_seqs.fasta \
            --out-folder ci_out/coding
          out="ci_out/coding/class/sequence/coding_seqs_vs_intergenomic_seqs"
          test -f "$out/gb-qc-report.csv"
          test -f "$out/gb-qc-report.html"
          test -f "$out/plots/per_sequence_nucleotide_content.png"
          test -f "$out/plots/per_position_nucleotide_content.png"

      - name: evaluate-classes (multiple CSV files, label column)
        run: |
          gb-qc evaluate-classes \
            --input examples/enhancers/data/enhancers_train.csv \
            --input examples/enhancers/data/enhancers_test.csv \
            --out-folder ci_out/enhancers
          test -f "ci_out/enhancers/class/sequence/0_vs_1/gb-qc-report.csv"
          test -f "ci_out/enhancers/class/sequence/0_vs_1/gb-qc-report.html"

      - name: evaluate-classes (TSV, multiple sequence columns)
        run: |
          gb-qc evaluate-classes \
            --input examples/paired-sequences/data/miRNA_mRNA_pairs_dataset.tsv \
            --sequence-column gene \
            --sequence-column noncodingRNA \
            --label-column label \
            --out-folder ci_out/miRNA
          test -f "ci_out/miRNA/class/gene/0_vs_1/gb-qc-report.csv"
          test -f "ci_out/miRNA/class/noncodingrna/0_vs_1/gb-qc-report.csv"
          test -f "ci_out/miRNA/class/merged/0_vs_1/gb-qc-report.csv"

      - name: evaluate-splits (data leakage, uses MMseqs2)
        run: |
          gb-qc evaluate-splits \
            --train-input examples/enhancers/data/enhancers_train.csv \
            --test-input examples/enhancers/data/enhancers_test.csv \
            --sequence-column sequence \
            --out-folder ci_out/splits
          test -f "ci_out/splits/split/sequence/enhancers_train_vs_enhancers_test/gb-qc-report.csv"
          test -f "ci_out/splits/split/sequence/enhancers_train_vs_enhancers_test/gb-qc-report.html"

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      # What PyPI will run on upload, run before the tag rather than after it.
      - name: Check metadata
        run: twine check dist/*

      # The version is dynamic - setuptools reads `__version__` out of the
      # package - so nothing otherwise ties the number that lands on PyPI to the
      # tag you published. This reads the built filename rather than the source
      # attribute, because the filename is what PyPI takes the version from: it
      # checks the artifact that will actually be uploaded. Failing here costs a
      # run. The wrong number on PyPI cannot be taken back at all.
      - name: Tag matches the built version
        if: github.event_name == 'release'
        env:
          # Through the environment, not interpolated into the script: a tag
          # name is attacker-controllable text.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(basename "$(ls dist/*.tar.gz)" .tar.gz)
          version=${version##*-}
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag '$TAG' does not match the built version" \
                 "'$version'. Either tag the release 'v$version', or bump" \
                 "__version__ in src/genomic_benchmarks_qc/__init__.py to match" \
                 "the tag - and note that the leading v is part of the tag and" \
                 "not part of the version."
            exit 1
          fi
          echo "Tag $TAG matches the built version $version."

      # MANIFEST.in exists so the sdist carries a suite that someone who never
      # cloned this repository can run. setuptools finds `tests/test_*.py` by
      # itself and nothing else, so a conftest, a helper module or a data file
      # added later goes missing from the tarball silently - the checkout above
      # still has it, and every other job here runs against the checkout. This
      # unpacks the built tarball somewhere that is not a checkout, which is the
      # only place that difference shows up.
      - name: Test suite from the unpacked sdist
        run: |
          mkdir -p "$RUNNER_TEMP/sdist"
          tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP/sdist"/genomic_benchmarks_qc-*/
          pip install '.[develop]'
          pytest -q

      # Last, so this holds bytes that have been checked and tested rather than
      # merely built - and so the publish job below uploads those same bytes.
      # Rebuilding there would test one tarball and ship a different one.
      #
      # On every run, not only on a release: a step that runs for the first time
      # on the one run that must not fail is a step nobody has ever seen work.
      - name: Upload the built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # The publish job downloads this seconds later, within this same run.
          # Nothing needs it afterwards; PyPI keeps the durable copy.
          retention-days: 7

  # No checkout step, deliberately: this job builds nothing and reads nothing
  # from the repository. It downloads what `package` tested and hands it to
  # PyPI, and that is all it can do - a `permissions:` block replaces the
  # defaults rather than adding to them, so every scope but `id-token` is
  # dropped here.
  publish:
    name: Publish to PyPI
    # Only on a published Release, and only once lint, all three Python versions
    # and the sdist suite are green on that exact commit. `needs:` cannot reach
    # across workflow files, which is why this lives in ci.yml rather than in a
    # release.yml of its own: a standalone workflow would have to either rebuild
    # everything itself or upload artifacts that nothing had verified.
    if: github.event_name == 'release'
    needs: [lint, test, package]
    runs-on: ubuntu-latest

    # Created at Settings -> Environments with a required reviewer, so the
    # upload waits for a second deliberate click and a stray tag cannot ship
    # anything on its own. The name has to match the pending publisher
    # registered on PyPI, which names this workflow file and this environment;
    # a mismatch reads to PyPI as an unauthorised publisher, not as a typo.
    environment:
      name: pypi
      url: https://pypi.org/p/genomic-benchmarks-qc

    permissions:
      # Trusted Publishing: GitHub mints a short-lived credential for this one
      # run and PyPI trades it for the upload, so there is no API token to
      # create, store or rotate. It also buys the PEP 740 attestation the action
      # attaches by default, which records that these files were built from this
      # commit in this repository - worth having for a tool people will cite.
      id-token: write

    steps:
      - name: Download the tested artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
