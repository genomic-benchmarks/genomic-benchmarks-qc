[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genomic-benchmarks-qc"
dynamic = ["version"]
description = "Genomic Benchmarks QC: Automated Quality Control for Genomic Machine Learning Datasets"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Katarina Gresova", email = "gresova11@gmail.com" },
]
keywords = [
    "genomic benchmarks",
    "deep learning",
    "machine learning",
    "computational biology",
    "bioinformatics",
    "genomics",
    "quality control",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=2.3.2",
    "pandas>=2.3.3",
    "matplotlib>=3.10.4",
    "seaborn>=0.13.2",
    "biopython>=1.86",
    "scikit-learn>=1.7.2",
    "scipy>=1.14",
    "typer>=0.20",
]

[project.optional-dependencies]
develop = ["pytest>=8.4", "pytest-cov>=7.0"]

[project.urls]
Homepage = "https://github.com/genomic-benchmarks/genomic-benchmarks-qc"
Repository = "https://github.com/genomic-benchmarks/genomic-benchmarks-qc"
Issues = "https://github.com/genomic-benchmarks/genomic-benchmarks-qc/issues"

[project.scripts]
gb-qc = "genomic_benchmarks_qc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Read from the package itself, so the number lives in exactly one place; see
# the comment in src/genomic_benchmarks_qc/__init__.py.
[tool.setuptools.dynamic]
version = {attr = "genomic_benchmarks_qc.__version__"}

# The report's stylesheets and scripts are read at report-generation time and
# inlined into the HTML, so they have to ship in the wheel. tests/test_report_assets.py
# loads every one of them through the loader, which is what catches a file added
# here and forgotten below.
[tool.setuptools.package-data]
"genomic_benchmarks_qc.report.assets" = ["*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source_pkgs = ["genomic_benchmarks_qc"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
